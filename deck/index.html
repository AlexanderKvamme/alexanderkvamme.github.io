<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study this deck on Flashcards</title>

    <!-- Open Graph / link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flashcards" />
    <meta property="og:title" content="Study this deck on Flashcards" />
    <meta property="og:description" content="A friend shared a flashcard deck with you. Follow it to study with spaced repetition and get their updates automatically." />
    <meta property="og:image" content="https://alexanderkvamme.github.io/share-icon.png" />
    <meta property="og:url" content="https://alexanderkvamme.github.io/deck/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Study this deck on Flashcards" />
    <meta name="twitter:description" content="A friend shared a flashcard deck with you. Follow it to study with spaced repetition." />
    <meta name="twitter:image" content="https://alexanderkvamme.github.io/share-icon.png" />

    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E7E5D8;
            color: #2b2b2b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
        }
        .card { max-width: 420px; width: 100%; text-align: center; }
        .icon { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        h1 { font-size: 26px; margin: 0 0 8px; }
        p { font-size: 16px; line-height: 1.45; color: #5b5b54; margin: 0 0 24px; }
        .btn {
            display: inline-block;
            background: #1c1c1c;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            padding: 14px 28px;
            border-radius: 14px;
        }
        .hint { margin-top: 18px; font-size: 13px; color: #8a8a80; }
    </style>
</head>
<body>
    <div class="card">
        <img class="icon" src="https://alexanderkvamme.github.io/share-icon.png" alt="Flashcards" />
        <h1>Open this deck in Flashcards</h1>
        <p>A friend shared a flashcard deck with you. Get the app to follow it and study, with updates from the author as they edit it.</p>
        <a class="btn" href="https://apps.apple.com/app/id6739949798">Get Flashcards</a>
        <div class="hint">Already have the app? Open this link from Messages or Notes to jump straight in.</div>
    </div>
</body>
</html>
